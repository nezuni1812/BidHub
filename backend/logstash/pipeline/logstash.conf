input {
  beats {
    port => 5044
  }

  file {
    path => "/usr/share/logstash/logs/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
      remove_field => ["message"]
    }
  }

  # Add application tags
  mutate {
    add_field => { "application" => "bidhub" }
  }

  # Parse timestamp if available
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Parse log level
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }

  # Parse error stack traces
  if [stack] {
    mutate {
      rename => { "stack" => "error.stack_trace" }
    }
  }

  # Add geo-location if IP exists
  if [ip] {
    geoip {
      source => "ip"
      target => "geoip"
    }
  }

  # Parse user agent if exists
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }

  # Parse request/response fields
  if [req] {
    mutate {
      rename => {
        "[req][method]" => "http.request.method"
        "[req][url]" => "http.request.url"
        "[req][headers]" => "http.request.headers"
      }
    }
  }

  if [res] {
    mutate {
      rename => {
        "[res][statusCode]" => "http.response.status_code"
      }
    }
  }

  # Parse duration to number
  if [duration] {
    mutate {
      convert => { "duration" => "float" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "bidhub-logs-%{+YYYY.MM.dd}"
    
    # Template for index mapping
    template_name => "bidhub-logs"
    template_pattern => "bidhub-logs-*"
    template_overwrite => true
  }

  # For debugging (optional, comment out in production)
  stdout {
    codec => rubydebug
  }
}
